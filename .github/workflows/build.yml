name: Build

on:
  push:

jobs:
  Validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform init
        run: make terraform-init

      - name: Terraform validate
        run: make terraform-validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.66.0

      - name: Terraform lint
        run: make terraform-lint
        env:
          # plugins are downloaded from GitHub releases, w/o token the API rate limit is shared by all runners on the IP
          GITHUB_TOKEN: ${{ github.token }}

      - name: Terraform test
        run: make terraform-test

  Release:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next'
    needs: Validate
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Release
        uses: agilecustoms/release@main
        with:
          floating-tags: false
        env:
          GH_TOKEN: ${{ secrets.GH_PUBLIC_RELEASES_TOKEN }}
